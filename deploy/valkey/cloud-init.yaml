#cloud-config
#
# A valkey box that reports to guard: metrics, host metrics, logs, and a health
# endpoint the cluster page can dial.
#
# WHAT DOES NOT ARRIVE, AND CANNOT. Traces. A datastore emits none, ever — redis
# spans are produced by the CLIENT library in your application, carry
# db.system=redis, and arrive from that service. No receiver here would change
# it, and there is deliberately no traces pipeline below: one with nothing
# feeding it is a lie on the page.
#
# WHAT ARRIVES BUT LOOKS LIKE NOTHING. This box turns persistence off, so valkey
# writes its startup banner and then, on a healthy day, NOTHING for weeks — no
# RDB saves to report, no errors. `start_at: end` then correctly reads past the
# banner and ships zero lines, which is indistinguishable from a broken pipeline
# and has been mistaken for one. That is why journald is a second logs receiver
# below: systemd's view of the unit — started, stopped, OOM-killed — keeps
# arriving on the days valkey itself has nothing to say, and an OOM kill is the
# one event you cannot afford to learn about from silence.
#
#   echo "1:M 1 Jan 2026 00:00:00.000 * test" >> /var/log/valkey/valkey-server.log
#
# is the one-command proof that the filelog half works.

package_update: true
package_upgrade: true
packages:
  - curl
  - ca-certificates
  - valkey-server
  - valkey-tools

write_files:
  - path: /opt/redis-health/health.py
    permissions: "0755"
    content: |
      #!/usr/bin/env python3
      # Liveness for the guard cluster page. It AUTHs before PINGing: an
      # unauthenticated PING answers -NOAUTH, which proves the server is alive
      # but also increments redis_acl_access_denied_auth_total on every probe —
      # a metric that should mean "somebody is guessing", not "the health check
      # ran".
      import http.server, os, socket

      PW = os.environ.get("REDIS_PASSWORD", "")

      def ping():
          s = None
          try:
              s = socket.create_connection(("127.0.0.1", 6379), timeout=2)
              if PW:
                  s.sendall(b"AUTH " + PW.encode() + b"\r\n")
                  if not s.recv(64).startswith(b"+OK"):
                      return False
              s.sendall(b"PING\r\n")
              return s.recv(64).startswith(b"+PONG")
          except Exception:
              return False
          finally:
              try:
                  if s: s.close()
              except Exception:
                  pass

      class H(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
              if self.path != "/health":
                  self.send_response(404); self.end_headers(); return
              ok = ping()
              body = b'{"status":"ok"}' if ok else b'{"status":"down"}'
              self.send_response(200 if ok else 503)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)
          def log_message(self, *a):
              pass

      http.server.HTTPServer(("0.0.0.0", 8080), H).serve_forever()

  - path: /etc/systemd/system/redis-health.service
    content: |
      [Unit]
      Description=Valkey health endpoint
      After=network-online.target valkey-server.service
      Wants=network-online.target

      [Service]
      EnvironmentFile=/etc/redis-exporter/env
      ExecStart=/usr/bin/python3 /opt/redis-health/health.py
      Restart=always
      RestartSec=3
      DynamicUser=yes
      NoNewPrivileges=yes

      [Install]
      WantedBy=multi-user.target

  - path: /etc/sysctl.d/99-valkey.conf
    content: |
      vm.overcommit_memory = 1
      net.core.somaxconn = 512

  # Proving the credential is its own script because it is the thing somebody
  # runs at 3am, after pasting the secret in by hand. Re-running it is safe.
  - path: /usr/local/sbin/otelcol-verify
    permissions: "0700"
    content: |
      #!/bin/sh
      # Prove the token against guard, then enable the collector.
      set -eu
      ENDPOINT="${GUARD_OTLP_ENDPOINT:-http://10.19.96.7:4318}"

      # Either source: a file pasted in by hand, or the environment guard
      # injected into /etc/environment and the manager's defaults.
      # An `&&` here would exit under `set -e` when the file is absent, which
      # is precisely the injected-from-guard case.
      if [ -f /etc/otelcol/env ]; then . /etc/otelcol/env; fi
      case "${GUARD_OTEL_SECRET:-}" in
        ""|REPLACE_ME) echo "GUARD_OTEL_SECRET is unset or still a placeholder — paste it into /etc/otelcol/env, or inject it from guard and re-run this over a fresh login" >&2; exit 1 ;;
      esac

      # An empty ExportLogsServiceRequest is a legitimate OTLP call that guard
      # answers 200. It proves the route and the token and writes no record.
      code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
        -X POST "$ENDPOINT/v1/logs" \
        -H 'Content-Type: application/json' \
        -H "Authorization: Bearer $GUARD_OTEL_SECRET" \
        -d '{"resourceLogs":[]}' || echo 000)

      case "$code" in
        200) : ;;
        401) echo "guard answered 401 — that value is neither GUARD_OTEL_SECRET nor GUARD_TOKEN on the guard box" >&2; exit 1 ;;
        000) echo "could not reach $ENDPOINT — check the address, and that guard binds 0.0.0.0:4318 rather than 127.0.0.1" >&2; exit 1 ;;
        *)   echo "guard answered $code at $ENDPOINT/v1/logs" >&2; exit 1 ;;
      esac

      # Validated before starting. A bad config exits at start, and on a box
      # nobody is watching that reads as silence.
      /usr/local/bin/otelcol-contrib validate --config=/etc/otelcol/config.yaml

      systemctl enable --now otelcol
      systemctl restart otelcol
      echo "otelcol is running; guard accepted the credential at $ENDPOINT"

  - path: /etc/otelcol/config.yaml
    permissions: "0644"
    content: |
      extensions:
        # The queue outlives a restart at either end. Guard is restarted by its
        # own dashboard whenever configuration is saved, and the records dropped
        # in that window are the ones explaining whatever prompted the change.
        file_storage/queue:
          directory: /var/lib/otelcol

      receivers:
        prometheus:
          config:
            scrape_configs:
              - job_name: redis
                scrape_interval: 30s
                static_configs:
                  - targets: ["127.0.0.1:9121"]
        # Valkey's own log lines, so /logs on guard has something from this box.
        filelog:
          include: [/var/log/valkey/valkey-server.log]
          start_at: end
          operators:
            # 12345:M 18 Aug 2026 01:02:03.456 * Ready to accept connections
            #
            # Unparsed, every record reaches guard as a raw string stamped with
            # the time it was RECEIVED and no severity — so a warning sorts
            # beside a startup notice and the timestamp is the collector's,
            # not valkey's. A line that does not match is still sent (on_error
            # defaults to send), so a format change degrades rather than drops.
            - type: regex_parser
              regex: '^(?P<pid>\d+):(?P<role>[A-Za-z]) (?P<ts>\d{2} \w{3} \d{4} \d{2}:\d{2}:\d{2}\.\d{3}) (?P<lvl>[.\-*#]) (?P<msg>.*)$'
              timestamp:
                # Valkey writes no offset, so this is read as UTC. True on this
                # box; check `timedatectl` before assuming it on another.
                parse_from: attributes.ts
                # gotime, because the layout below is Go's reference time. The
                # default is strptime, which rejects a format carrying decimals
                # — and valkey's milliseconds are the whole reason to parse the
                # stamp rather than take the collector's.
                layout_type: gotime
                layout: '02 Jan 2006 15:04:05.000'
              severity:
                parse_from: attributes.lvl
                # Without this the record keeps "*" as its severity TEXT — the
                # mapping below sets the numeric level, but guard facets on the
                # text, and a severity filter offering "*" and "#" is a filter
                # nobody can use. This replaces it with the level's own name.
                overwrite_text: true
                mapping:
                  debug: "."
                  info: ["-", "*"]
                  warn: "#"
            # The line, not a bag of attributes with the line inside it.
            - type: move
              from: attributes.msg
              to: body
        # The second logs receiver, and the one that still speaks on a quiet
        # day. Persistence is off on this box, so the logfile above can go weeks
        # without a line — while systemd is still recording every start, stop,
        # failure and OOM kill of the unit. Valkey logs to a FILE here, not to
        # stdout, so these two never duplicate each other.
        journald:
          units: [valkey-server.service, redis-exporter.service, redis-health.service]
          priority: info
          start_at: end
          operators:
            # A journal entry is a MAP, not a line: MESSAGE, _PID, _SYSTEMD_UNIT
            # and thirty more fields. Left alone the record reaches guard with
            # no string body at all and draws as an empty row — present in the
            # counts, invisible on the page.
            #
            # The unit is copied out FIRST, because the move below replaces the
            # whole body and everything not saved goes with it.
            - type: copy
              from: body._SYSTEMD_UNIT
              to: attributes.unit
              on_error: send_quiet
            - type: move
              from: body.MESSAGE
              to: body
        # The box itself — CPU, memory, disk, load. Guard's cluster page gets
        # these over SSH when it has a login; this is the same numbers without
        # one.
        hostmetrics:
          collection_interval: 60s
          scrapers:
            cpu:
            memory:
            load:
            filesystem:

      processors:
        batch:
        resource:
          attributes:
            - key: service.name
              value: redis
              action: upsert
            - key: service.instance.id
              value: pack-redis-vps-main
              action: upsert
            # Guard files telemetry under a machine by HOST, never by name
            # (internal/telemetry/topology.go) — two services called "api" on
            # two boxes are two different things. Without a host attribute this
            # instance is unassigned, and picking this machine in the Machines
            # filter resolves to "no rows" rather than to these logs.
            #
            # It must match the host in the NODE'S URL, which is the health
            # address guard dials — not the hostname, which is
            # PACK-REDIS-VPS-MAIN and matches nothing. resourcedetection would
            # set the hostname here, which is why this line comes after it.
            - key: host.name
              value: 10.19.96.6
              action: upsert

      exporters:
        otlphttp/guard:
          # Base URL — the collector appends /v1/metrics and /v1/logs itself.
          endpoint: http://10.19.96.7:4318
          headers:
            Authorization: "Bearer ${env:GUARD_OTEL_SECRET}"
          retry_on_failure:
            enabled: true
          sending_queue:
            enabled: true
            storage: file_storage/queue

      service:
        extensions: [file_storage/queue]
        pipelines:
          metrics:
            receivers: [prometheus, hostmetrics]
            processors: [resource, batch]
            exporters: [otlphttp/guard]
          logs:
            receivers: [filelog, journald]
            processors: [resource, batch]
            exporters: [otlphttp/guard]

  - path: /etc/systemd/system/redis-exporter.service
    content: |
      [Unit]
      Description=Redis/Valkey Prometheus exporter
      After=network-online.target valkey-server.service
      Wants=network-online.target

      [Service]
      EnvironmentFile=/etc/redis-exporter/env
      # Loopback: the collector on this box is the only scraper, and /metrics
      # describes the keyspace to anyone who can read it.
      ExecStart=/usr/local/bin/redis_exporter -web.listen-address=127.0.0.1:9121 -redis.addr=127.0.0.1:6379
      Restart=always
      RestartSec=3
      DynamicUser=yes
      NoNewPrivileges=yes

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/otelcol.service
    content: |
      [Unit]
      Description=OpenTelemetry Collector (redis + host -> Guard)
      After=network-online.target redis-exporter.service
      Wants=network-online.target

      [Service]
      # The leading dash is for the box configured from guard: Inject writes
      # the variables into the manager's own defaults, and then there is no file
      # here to read. An empty bearer token still cannot start the collector —
      # otelcol-verify proves the credential against guard before enabling it,
      # which is a better gate than a missing file anyway.
      EnvironmentFile=-/etc/otelcol/env
      ExecStart=/usr/local/bin/otelcol-contrib --config=/etc/otelcol/config.yaml
      Restart=always
      RestartSec=3
      DynamicUser=yes
      # Where the sending queue lives. DynamicUser has no home and cannot make
      # this itself; StateDirectory hands it /var/lib/otelcol already owned.
      StateDirectory=otelcol
      # Reading valkey's log needs a group; DynamicUser gets a private UID that
      # is in none of them by default. systemd-journal is the same problem for
      # the journald receiver — without it that receiver starts, reports nothing
      # wrong, and ships zero records, which is the exact shape of the bug this
      # file exists to avoid.
      SupplementaryGroups=adm systemd-journal
      NoNewPrivileges=yes

      [Install]
      WantedBy=multi-user.target

runcmd:
  - sysctl --system
  - >
    bash -c 'echo never > /sys/kernel/mm/transparent_hugepage/enabled || true'
  - >
    bash -c 'CONF=/etc/valkey/valkey.conf;
    [ -f "$CONF" ] || CONF=/etc/redis/redis.conf;
    PW=$(openssl rand -base64 32 | tr -d "/+=" | head -c 32);
    sed -i "s/^bind .*/bind 127.0.0.1 10.19.96.6/" "$CONF";
    sed -i "s/^protected-mode .*/protected-mode yes/" "$CONF";
    sed -i "s/^# *requirepass .*/requirepass $PW/" "$CONF";
    grep -q "^requirepass" "$CONF" || echo "requirepass $PW" >> "$CONF";
    sed -i "s/^save /# save /" "$CONF";
    grep -q "^appendonly" "$CONF" && sed -i "s/^appendonly .*/appendonly no/" "$CONF" || echo "appendonly no" >> "$CONF";
    grep -q "^logfile" "$CONF" && sed -i "s|^logfile .*|logfile /var/log/valkey/valkey-server.log|" "$CONF" || echo "logfile /var/log/valkey/valkey-server.log" >> "$CONF";
    printf "\n# --- cache tuning ---\nmaxmemory 700mb\nmaxmemory-policy allkeys-lru\ntimeout 300\ntcp-keepalive 60\n" >> "$CONF";
    install -m 600 /dev/null /root/.valkey_pw;
    echo "$PW" > /root/.valkey_pw'
  # The password, written once and read by both the exporter and the health
  # probe. 0600 root: systemd loads it as root before dropping privileges.
  - >
    bash -c 'install -d -m 700 /etc/redis-exporter;
    printf "REDIS_PASSWORD=%s\n" "$(cat /root/.valkey_pw)" > /etc/redis-exporter/env;
    chmod 600 /etc/redis-exporter/env'
  - >
    bash -c 'systemctl enable valkey-server 2>/dev/null || systemctl enable redis-server;
    systemctl restart valkey-server 2>/dev/null || systemctl restart redis-server'
  - systemctl daemon-reload
  - systemctl enable --now redis-health
  # Verified against the release's own sha256sums.txt. A shipper installed from
  # an unverified tarball is a worse problem than a missing metric.
  - >
    bash -c 'set -e; ARCH=$(dpkg --print-architecture);
    VER=1.89.0;
    N="redis_exporter-v${VER}.linux-${ARCH}.tar.gz";
    B="https://github.com/oliver006/redis_exporter/releases/download/v${VER}";
    curl -fsSL -o /tmp/$N "$B/$N";
    curl -fsSL -o /tmp/re-sums "$B/sha256sums.txt";
    W=$(grep " $N$" /tmp/re-sums | cut -d" " -f1);
    H=$(sha256sum /tmp/$N | cut -d" " -f1);
    [ -n "$W" ] && [ "$W" = "$H" ] || { echo "redis_exporter checksum mismatch"; exit 1; };
    tar -xzf /tmp/$N -C /tmp;
    install -m 755 /tmp/redis_exporter-v${VER}.linux-${ARCH}/redis_exporter /usr/local/bin/redis_exporter;
    rm -rf /tmp/$N /tmp/re-sums /tmp/redis_exporter-v${VER}.linux-${ARCH}'
  - systemctl enable --now redis-exporter
  # Contrib, not the core distribution: filelog and journald are contrib
  # receivers, and core would start fine and read nothing.
  - >
    bash -c 'set -e; ARCH=$(dpkg --print-architecture);
    VER=0.158.0;
    N="otelcol-contrib_${VER}_linux_${ARCH}.tar.gz";
    B="https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${VER}";
    curl -fsSL -o /tmp/$N "$B/$N";
    curl -fsSL -o /tmp/oc-sum "$B/$N.sha256";
    W=$(cut -d" " -f1 /tmp/oc-sum);
    H=$(sha256sum /tmp/$N | cut -d" " -f1);
    [ -n "$W" ] && [ "$W" = "$H" ] || { echo "otelcol checksum mismatch"; exit 1; };
    tar -xzf /tmp/$N -C /tmp otelcol-contrib;
    install -m 755 /tmp/otelcol-contrib /usr/local/bin/otelcol-contrib;
    rm -f /tmp/$N /tmp/oc-sum /tmp/otelcol-contrib'
  # 0755 so the collector's DynamicUser can read config.yaml. NO env file is
  # written beside it, and that is the decision this box is built on:
  #
  # GUARD IS THE SOURCE OF THE SECRET. It lives in guard's database, sealed,
  # and reaches this machine through Save → Inject on the machine's page —
  # /etc/environment and the manager's own defaults. Changing it is two presses
  # and a restart, from wherever you are, rather than an SSH session.
  #
  # A seeded /etc/otelcol/env would quietly beat that: a unit's EnvironmentFile
  # overrides the manager's DefaultEnvironment, so a forgotten REPLACE_ME wins
  # over a correct inject and every batch 401s while both the dashboard and the
  # drop-in look right. The file is left absent so there is one answer to
  # "where does this value come from", and the unit's EnvironmentFile carries a
  # leading dash so absent is legal.
  - bash -c 'install -d -m 755 /etc/otelcol'
  # Not enabled here, because the secret arrives after this file has finished:
  # the box has to exist before guard can inject into it. otelcol-verify is the
  # gate and prints what is missing — it reads the environment from either
  # source, proves it against guard, validates the config and only then starts
  # the collector. A collector started with an empty bearer token looks healthy
  # and drops every batch; the loudest thing to do is not start.
  - >
    bash -c '/usr/local/sbin/otelcol-verify ||
    echo "otelcol NOT enabled: inject GUARD_OTEL_SECRET from guard, then re-run /usr/local/sbin/otelcol-verify over a fresh login"'
  # The host firewall is not the perimeter — the Vultr firewall group is, and it
  # filters the public interface only. Everything open from the VPC; 22 left for
  # the group to gate.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow from 10.19.96.0/24 comment 'vpc — gated at the provider'
  - ufw allow 22/tcp comment 'ssh — restricted in the Vultr firewall group'
  - ufw --force enable

final_message: |
  valkey, health endpoint, exporter and collector are installed.

  otelcol is deliberately NOT running. Finish it:

    printf 'GUARD_OTEL_SECRET=<value from guard Settings -> Configuration>\n' > /etc/otelcol/env
    chmod 600 /etc/otelcol/env
    /usr/local/sbin/otelcol-verify

  That proves the token against guard before enabling anything.

  Metrics arrive within 30s. LOGS MAY LOOK MISSING AND NOT BE: persistence is
  off here, so valkey's own logfile can stay silent for weeks. journald is the
  second receiver for exactly that reason. To prove the filelog half:

    echo "1:M 1 Jan 2026 00:00:00.000 * test" >> /var/log/valkey/valkey-server.log

  Traces will never arrive from this box. They come from the application
  calling valkey, with db.system=redis on its client spans.

  Port 22 is open at this host by design; the Vultr firewall group restricts it.
  Confirm that group is not 0.0.0.0/0.
