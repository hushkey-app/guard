#cloud-config
# Provision a box that runs guard and guard-vault.
#
# It installs no toolchain and builds nothing. The two binaries are downloaded
# from a GitHub release, checksum-verified and started — by the same
# deploy/guard-update the box then keeps running on a timer, so the first
# install and every later one take exactly the same path. There is nothing here
# that only works once.
#
# Set VERSION and VAULT_ADDR below, paste as user-data, boot.
#
#   VERSION     `latest` to follow releases, or a tag like v0.1.0 to pin.
#   VAULT_ADDR  where the secrets server listens. 127.0.0.1 serves only this
#               box; give it the private address to serve the VPC, and do not
#               give it 0.0.0.0.

package_update: true
packages:
  - curl
  - ca-certificates

write_files:
  # Which release this box should be on. guard's Update button rewrites this,
  # and guard-update reads it every fifteen minutes.
  - path: /etc/guard/version
    content: |
      latest

  - path: /etc/systemd/system/guard.service
    content: |
      [Unit]
      Description=guard — telemetry, cluster and the secrets dashboard
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/local/bin/guard -db /var/lib/guard/guard.db
      User=guard
      Restart=always
      RestartSec=2
      # The database, its WAL and the key file — plus /etc/guard/version, which
      # is the one thing the dashboard's Update button writes.
      ProtectSystem=strict
      ReadWritePaths=/var/lib/guard /etc/guard
      NoNewPrivileges=yes
      PrivateTmp=yes

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/guard-vault.service
    content: |
      [Unit]
      Description=guard-vault — secrets for the applications
      After=network-online.target guard.service
      Wants=network-online.target

      [Service]
      # VAULT_ADDR: 127.0.0.1 serves this box only. Use the private address to
      # serve the VPC. Never 0.0.0.0 — nothing here wants to be on the internet.
      ExecStart=/usr/local/bin/guard-vault -db /var/lib/guard/guard.db -addr 127.0.0.1:4319
      User=guard
      Restart=always
      RestartSec=2
      ProtectSystem=strict
      ReadWritePaths=/var/lib/guard
      NoNewPrivileges=yes
      PrivateTmp=yes

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/guard-update.service
    content: |
      [Unit]
      Description=install the guard release this box is asked for
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/guard-update
      User=root

  - path: /etc/systemd/system/guard-update.timer
    content: |
      [Unit]
      Description=check for a new guard release

      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=15min
      RandomizedDelaySec=2min
      Persistent=true

      [Install]
      WantedBy=timers.target

runcmd:
  - [ sh, -c, "id -u guard >/dev/null 2>&1 || useradd --system --home-dir /var/lib/guard --create-home --shell /usr/sbin/nologin guard" ]
  - [ install, -d, -o, guard, -g, guard, -m, "0750", /var/lib/guard ]
  # root writes the version file; guard rewrites it from the dashboard.
  - [ install, -d, -o, guard, -g, guard, -m, "0755", /etc/guard ]
  - [ chown, "guard:guard", /etc/guard/version ]
  # The updater, taken from the repo at the version this box is pinned to. It
  # is the only thing fetched from git — the binaries come from the release.
  - [ sh, -c, "curl -fsSL https://raw.githubusercontent.com/hushkey-app/guard/main/deploy/guard-update -o /usr/local/bin/guard-update" ]
  - [ chmod, "0755", /usr/local/bin/guard-update ]
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, guard.service, guard-vault.service, guard-update.timer ]
  # The first install is an ordinary update: download, verify, install, start
  # guard, wait for it to answer, then the vault. Nothing here is a special
  # first-boot path that stops being exercised afterwards.
  - [ /usr/local/bin/guard-update ]

final_message: |
  guard is up on :4318 and guard-vault on :4319.

  Two things this could not do for you:

    * The key. Guard generated /var/lib/guard/guard.db.key on first start.
      Back it up with the database — without it the stored secrets restore as
      unreadable. To join a box to an existing database instead, put that key
      in place before first boot, or set GUARD_SECRET_KEY in the units.

    * The door. Guard listens on :4318 for the dashboard and for OTLP. Put it
      behind whatever fronts your other services, and leave the vault on the
      private address.
