services:
  guard:
    build: .
    ports:
      - "4318:4318"
    environment:
      GUARD_DB_PATH: /data/guard.db
      GUARD_RETENTION_HOURS: "168"
      GUARD_MAX_EVENTS: "1000000"
    volumes:
      - guard-data:/data
    restart: unless-stopped

  # The secrets server: same image, same volume, its own container.
  #
  # Deployed and restarted separately on purpose — an application asking for its
  # database password at boot must not be waiting on the dashboard's release. It
  # shares the database file and the key file beside it, which is why it mounts
  # the same volume; without that key it refuses to start rather than answering
  # with values it cannot decrypt.
  #
  # No published port. Applications reach it on the compose network, or over the
  # VPC — nothing about it wants to be on the internet, and the keys it accepts
  # are the ones minted on guard's /secrets page.
  vault:
    build: .
    entrypoint: ["guard-vault"]
    environment:
      GUARD_DB_PATH: /data/guard.db
      GUARD_VAULT_ADDR: ":4319"
    expose:
      - "4319"
    volumes:
      - guard-data:/data
    # always, not unless-stopped: this one is somebody's boot dependency.
    restart: always
    depends_on:
      # Guard owns the schema, so on a brand new volume the vault has nothing to
      # read until guard has opened the database once. It exits and is restarted
      # rather than starting empty, which is the correct failure — but starting
      # it second makes that a non-event rather than a minute of red logs.
      - guard

volumes:
  guard-data:
